<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 800" width="1060" height="800" font-family="Arial, Helvetica, sans-serif">
  <!-- Plan du hub COHUE (A09-02). Echelle : 1 stud = 3 px. Origine (0,0) = centre de la place.
       px = 390 + 3x ; py = 360 + 3z (nord = -Z Roblox = haut du plan). Source : docs/dossier/65-lobby.md -->
  <rect x="0" y="0" width="1060" height="800" fill="#FFFFFF"/>
  <text x="30" y="36" font-size="20" font-weight="bold" fill="#2D2852">COHUE — Plan du hub (A09-02)</text>
  <text x="30" y="54" font-size="12" fill="#5B5675">Vue de dessus · 1 stud = 3 px · temps de marche à 16 studs/s · maquette, rien n'est construit</text>

  <!-- Nord -->
  <g transform="translate(720,34)">
    <polygon points="0,-16 8,6 0,1 -8,6" fill="#2D2852"/>
    <text x="0" y="22" font-size="12" font-weight="bold" text-anchor="middle" fill="#2D2852">N</text>
  </g>

  <!-- Bordure : arbres et falaises qui ferment le village -->
  <rect x="36" y="66" width="708" height="648" rx="40" fill="#BFD9AE"/>
  <rect x="48" y="78" width="684" height="630" rx="30" fill="#EEF3E6"/>

  <!-- Maisons de décor (16 x 16 studs, non visitables) -->
  <g fill="#DCCDB2" stroke="#B9A684" stroke-width="2">
    <rect x="198" y="558" width="48" height="48" rx="4"/>
    <rect x="96" y="552" width="48" height="48" rx="4"/>
    <rect x="150" y="636" width="48" height="48" rx="4"/>
    <rect x="534" y="558" width="48" height="48" rx="4"/>
    <rect x="636" y="552" width="48" height="48" rx="4"/>
    <rect x="582" y="636" width="48" height="48" rx="4"/>
    <rect x="246" y="84" width="48" height="40" rx="4"/>
    <rect x="486" y="84" width="48" height="40" rx="4"/>
  </g>

  <!-- Chemins (16 studs de large) -->
  <g stroke="#E6D8B6" stroke-width="48" stroke-linecap="round" fill="none">
    <line x1="287" y1="298" x2="214" y2="252"/>
    <line x1="493" y1="298" x2="566" y2="252"/>
    <line x1="280" y1="378" x2="214" y2="378"/>
    <line x1="500" y1="372" x2="560" y2="372"/>
  </g>

  <!-- 7 Hall of Fame (classements) -->
  <rect x="90" y="132" width="162" height="144" rx="10" fill="#FCEFC2" stroke="#E0B530" stroke-width="2"/>
  <rect x="117" y="166" width="58" height="12" rx="2" fill="#C99A06"/>
  <rect x="185" y="152" width="58" height="12" rx="2" fill="#C99A06"/>
  <text x="146" y="194" font-size="10" text-anchor="middle" fill="#6B5200">WEEKLY KO</text>
  <text x="214" y="180" font-size="10" text-anchor="middle" fill="#6B5200">ALL-TIME KO</text>
  <rect x="160" y="230" width="12" height="12" fill="#E0B530"/>
  <rect x="172" y="222" width="12" height="20" fill="#F2C94C"/>
  <rect x="184" y="234" width="12" height="8" fill="#D9A520"/>
  <text x="178" y="256" font-size="10" text-anchor="middle" fill="#6B5200">podium top 3</text>
  <text x="171" y="146" font-size="12" font-weight="bold" text-anchor="middle" fill="#6B5200">7 · HALL OF FAME</text>

  <!-- 8 Quest Board -->
  <rect x="528" y="132" width="162" height="144" rx="10" fill="#D6EBFD" stroke="#4BA3F5" stroke-width="2"/>
  <rect x="570" y="176" width="60" height="12" rx="2" fill="#2F80D1"/>
  <text x="600" y="204" font-size="10" text-anchor="middle" fill="#174A7E">tableau 20 x 12 studs</text>
  <circle cx="588" cy="226" r="5" fill="#174A7E"/>
  <text x="600" y="246" font-size="10" text-anchor="middle" fill="#174A7E">prompt « Quests »</text>
  <text x="609" y="146" font-size="12" font-weight="bold" text-anchor="middle" fill="#174A7E">8 · QUEST BOARD</text>

  <!-- 4 Portal Court -->
  <rect x="264" y="180" width="252" height="78" rx="12" fill="#EDE4FB" stroke="#9F7AEA" stroke-width="2"/>
  <rect x="330" y="136" width="120" height="30" rx="6" fill="#7B3FE4"/>
  <text x="390" y="156" font-size="12" font-weight="bold" text-anchor="middle" fill="#FFFFFF">PORTAL · 44 studs</text>
  <text x="390" y="128" font-size="12" font-weight="bold" text-anchor="middle" fill="#4B1FA8">4 · PORTAL COURT</text>
  <circle cx="312" cy="228" r="18" fill="#C9B2F7" stroke="#7B3FE4" stroke-width="2"/>
  <circle cx="390" cy="216" r="24" fill="#C9B2F7" stroke="#7B3FE4" stroke-width="2"/>
  <circle cx="468" cy="228" r="24" fill="#C9B2F7" stroke="#7B3FE4" stroke-width="2"/>
  <text x="312" y="232" font-size="10" font-weight="bold" text-anchor="middle" fill="#2D1466">SOLO</text>
  <text x="390" y="220" font-size="10" font-weight="bold" text-anchor="middle" fill="#2D1466">FRIENDS</text>
  <text x="468" y="232" font-size="10" font-weight="bold" text-anchor="middle" fill="#2D1466">PUBLIC</text>

  <!-- 5 Critter Pen -->
  <rect x="54" y="306" width="168" height="144" rx="10" fill="#D7F2D1" stroke="#3E9E35" stroke-width="3" stroke-dasharray="10 5"/>
  <rect x="216" y="360" width="12" height="36" fill="#EEF3E6"/>
  <g fill="#3E9E35">
    <circle cx="92" cy="350" r="6"/><circle cx="140" cy="334" r="6"/><circle cx="178" cy="372" r="6"/>
    <circle cx="110" cy="404" r="6"/><circle cx="160" cy="420" r="6"/>
  </g>
  <rect x="232" y="404" width="20" height="16" rx="3" fill="#3E9E35"/>
  <text x="242" y="434" font-size="10" text-anchor="middle" fill="#1F5E19">kiosque</text>
  <text x="138" y="324" font-size="12" font-weight="bold" text-anchor="middle" fill="#1F5E19">5 · CRITTER PEN</text>
  <text x="138" y="442" font-size="10" text-anchor="middle" fill="#1F5E19">compagnons capturés en liberté</text>

  <!-- 6 Shop -->
  <rect x="564" y="318" width="114" height="108" rx="8" fill="#FFE0CC" stroke="#FF8A3D" stroke-width="3"/>
  <rect x="560" y="360" width="8" height="24" fill="#FF8A3D"/>
  <g fill="#E0661B"><circle cx="596" cy="406" r="5"/><circle cx="620" cy="406" r="5"/><circle cx="644" cy="406" r="5"/></g>
  <circle cx="548" cy="372" r="5" fill="#9A3F0A"/>
  <text x="621" y="342" font-size="11" font-weight="bold" text-anchor="middle" fill="#9A3F0A">6 · GOB'S GLAM SHOP</text>
  <text x="621" y="372" font-size="10" text-anchor="middle" fill="#9A3F0A">comptoir + Gob</text>
  <text x="621" y="394" font-size="10" text-anchor="middle" fill="#9A3F0A">vitrine (3 mannequins)</text>

  <!-- 3 Plaza -->
  <circle cx="390" cy="360" r="120" fill="#F4E7C8" stroke="#D8C79F" stroke-width="3"/>
  <polygon points="390,318 404,346 396,346 396,384 384,384 384,346 376,346" fill="#E3D2A8"/>
  <text x="414" y="400" font-size="12" font-weight="bold" fill="#7A6534">3 · PLAZA r = 40</text>
  <text x="414" y="414" font-size="10" fill="#7A6534">centre dégagé,</text>
  <text x="414" y="427" font-size="10" fill="#7A6534">mosaïque → portail</text>
  <g fill="#B9A684">
    <rect x="286" y="316" width="22" height="8" rx="3"/>
    <rect x="472" y="316" width="22" height="8" rx="3"/>
  </g>
  <text x="297" y="338" font-size="9" text-anchor="middle" fill="#7A6534">bancs</text>
  <text x="483" y="338" font-size="9" text-anchor="middle" fill="#7A6534">bancs</text>

  <!-- 2 Hero Row : avenue + 8 présentoirs -->
  <rect x="354" y="470" width="72" height="166" fill="#E6D8B6"/>
  <rect x="290" y="468" width="56" height="162" rx="6" fill="#E8E2F4"/>
  <rect x="434" y="468" width="56" height="162" rx="6" fill="#E8E2F4"/>
  <g stroke="#2D2852" stroke-width="2">
    <rect x="306" y="600" width="24" height="24" rx="3" fill="#2D2852"/>
    <rect x="306" y="558" width="24" height="24" rx="3" fill="#2D2852"/>
    <rect x="450" y="600" width="24" height="24" rx="3" fill="#2D2852"/>
  </g>
  <g fill="#C3C1CC" stroke="#8F8BA0" stroke-width="2">
    <rect x="306" y="516" width="24" height="24" rx="3"/>
    <rect x="306" y="474" width="24" height="24" rx="3"/>
    <rect x="450" y="558" width="24" height="24" rx="3"/>
    <rect x="450" y="516" width="24" height="24" rx="3"/>
    <rect x="450" y="474" width="24" height="24" rx="3"/>
  </g>
  <g font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    <text x="318" y="616">K</text><text x="318" y="574">M</text><text x="462" y="616">A</text>
  </g>
  <g font-size="10" font-weight="bold" fill="#5B5675" text-anchor="middle">
    <text x="318" y="532">R</text><text x="318" y="490">B</text>
    <text x="462" y="574">G</text><text x="462" y="532">C</text><text x="462" y="490">T</text>
  </g>
  <g font-size="10" fill="#2D2852" text-anchor="end">
    <text x="286" y="616">Knight</text><text x="286" y="574">Mage</text>
    <text x="286" y="532">Rogue</text><text x="286" y="490">Barbarian</text>
  </g>
  <g font-size="10" fill="#2D2852" text-anchor="start">
    <text x="494" y="616">Archer</text><text x="494" y="574">Guardian</text>
    <text x="494" y="532">Cleric</text><text x="494" y="490">Tamer</text>
  </g>
  <text x="318" y="460" font-size="12" font-weight="bold" text-anchor="middle" fill="#2D2852">2 · HERO ROW</text>

  <!-- 1 Arrival -->
  <rect x="342" y="636" width="96" height="54" rx="6" fill="#FFFFFF" stroke="#2D2852" stroke-width="2"/>
  <text x="446" y="660" font-size="12" font-weight="bold" fill="#2D2852">1 · ARRIVAL</text>
  <text x="446" y="675" font-size="10" fill="#5B5675">face au portail</text>
  <rect x="330" y="694" width="120" height="10" rx="2" fill="#A0896B"/>

  <!-- Flux : 1re run (rouge) et retour (marine) -->
  <polyline points="376,664 336,622 384,568 384,300 322,240" fill="none" stroke="#E5484D" stroke-width="5" stroke-dasharray="12 7" stroke-linejoin="round"/>
  <polyline points="404,664 404,300 452,244" fill="none" stroke="#2D2852" stroke-width="4" stroke-dasharray="3 6" stroke-linecap="round"/>
  <g font-size="11" font-weight="bold" text-anchor="middle" fill="#FFFFFF">
    <circle cx="376" cy="664" r="10" fill="#E5484D"/><text x="376" y="668">1</text>
    <circle cx="336" cy="622" r="10" fill="#E5484D"/><text x="336" y="626">2</text>
    <circle cx="384" cy="470" r="10" fill="#E5484D"/><text x="384" y="474">3</text>
    <circle cx="322" cy="240" r="10" fill="#E5484D"/><text x="322" y="244">4</text>
  </g>

  <!-- Echelle -->
  <line x1="60" y1="748" x2="180" y2="748" stroke="#2D2852" stroke-width="3"/>
  <line x1="60" y1="742" x2="60" y2="754" stroke="#2D2852" stroke-width="2"/>
  <line x1="180" y1="742" x2="180" y2="754" stroke="#2D2852" stroke-width="2"/>
  <text x="190" y="752" font-size="11" fill="#2D2852">40 studs ≈ 2,5 s de marche</text>
  <text x="430" y="752" font-size="11" fill="#5B5675">Emprise totale ≈ 230 x 215 studs</text>

  <!-- Légende -->
  <g transform="translate(770,72)">
    <text x="0" y="0" font-size="14" font-weight="bold" fill="#2D2852">Parcours</text>
    <line x1="0" y1="18" x2="36" y2="18" stroke="#E5484D" stroke-width="5" stroke-dasharray="12 7"/>
    <text x="44" y="22" font-size="11" fill="#2D2852">1re run d'un nouveau joueur</text>
    <line x1="0" y1="38" x2="36" y2="38" stroke="#2D2852" stroke-width="4" stroke-dasharray="3 6" stroke-linecap="round"/>
    <text x="44" y="42" font-size="11" fill="#2D2852">joueur qui revient</text>

    <text x="0" y="72" font-size="14" font-weight="bold" fill="#2D2852">1re run en moins de 60 s</text>
    <g font-size="11" fill="#2D2852">
      <text x="0" y="92">1  0 s · arrivée, caméra sur le portail</text>
      <text x="0" y="108">2  2 s · « Try on » au présentoir Knight</text>
      <text x="0" y="124">3  ~6 s · remonte la Hero Row</text>
      <text x="0" y="140">4  ~12 s · pad SOLO, décompte 3 s</text>
      <text x="0" y="156">   ~15 s · téléportation + chargement</text>
      <text x="0" y="172" font-weight="bold">   ~35-45 s · la run démarre</text>
    </g>

    <text x="0" y="206" font-size="14" font-weight="bold" fill="#2D2852">Marche depuis l'arrivée</text>
    <g font-size="11" fill="#2D2852">
      <text x="0" y="226">1er présentoir ............ 1,8 s</text>
      <text x="0" y="242">enclos, boutique ........ 6,9 s</text>
      <text x="0" y="258">pads du portail ........... 9,3 s</text>
      <text x="0" y="274">classements, quêtes ... 10,1 s</text>
      <text x="0" y="290">station à station ... max 8,5 s</text>
    </g>

    <text x="0" y="324" font-size="14" font-weight="bold" fill="#2D2852">Présentoirs</text>
    <rect x="0" y="334" width="16" height="16" rx="3" fill="#2D2852"/>
    <text x="24" y="346" font-size="11" fill="#2D2852">gratuit : Knight, Archer, Mage</text>
    <rect x="0" y="358" width="16" height="16" rx="3" fill="#C3C1CC" stroke="#8F8BA0" stroke-width="2"/>
    <text x="24" y="370" font-size="11" fill="#2D2852">à débloquer par quête</text>

    <text x="0" y="404" font-size="14" font-weight="bold" fill="#2D2852">Couleur de zone = couleur du menu</text>
    <g font-size="11" fill="#2D2852">
      <rect x="0" y="414" width="16" height="12" fill="#7B3FE4"/><text x="24" y="424">portail et file (Play)</text>
      <rect x="0" y="432" width="16" height="12" fill="#3E9E35"/><text x="24" y="442">compagnons</text>
      <rect x="0" y="450" width="16" height="12" fill="#FF8A3D"/><text x="24" y="460">boutique</text>
      <rect x="0" y="468" width="16" height="12" fill="#E0B530"/><text x="24" y="478">classements</text>
      <rect x="0" y="486" width="16" height="12" fill="#4BA3F5"/><text x="24" y="496">quêtes</text>
    </g>
    <text x="0" y="522" font-size="10" fill="#5B5675">Teintes provisoires : à caler sur le guide</text>
    <text x="0" y="536" font-size="10" fill="#5B5675">de style A01 et le design system A08.</text>
  </g>
</svg>
